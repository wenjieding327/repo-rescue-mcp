name: reliability

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # v4, pinned for a reproducible release pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # v4, pinned.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      # v5, pinned.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Test hosted snippet backend
        run: npm test

      - name: Run deterministic snippet benchmark
        run: npm run benchmark

      - name: Install Python backend
        run: python -m pip install -e ".[dev]"

      - name: Test repository repair backend
        run: python -m pytest

      - name: Smoke-test MCP tool discovery
        run: python scripts/smoke_stdio.py

      - name: Smoke-test MCP repair and artifact retrieval
        run: python scripts/smoke_mcp.py

      - name: Smoke-test Windows one-click demo
        if: runner.os == 'Windows'
        shell: powershell
        run: .\demo.ps1

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v4, pinned for a reproducible release pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # v5, pinned.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Build MCP service image
        run: docker build -t repo-rescue-mcp:test .

      - name: Build repository verifier image
        run: docker build -t repo-rescue-python:3.11 -f sandbox/Dockerfile.python311 .

      - name: Install repository orchestrator
        run: python -m pip install -e .

      - name: Run Docker baseline-repair-verify smoke
        run: python scripts/smoke_docker.py
