name: reliability

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # v5, pinned for a reproducible release pipeline.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # v5, pinned.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "20"
          cache: npm

      # v6, pinned.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Test hosted snippet backend
        run: npm test

      - name: Run deterministic snippet benchmark
        run: npm run benchmark

      - name: Install Python backend
        run: python -m pip install -e ".[dev]"

      - name: Test repository repair backend
        run: python -m pytest

      - name: Smoke-test MCP tool discovery
        run: python scripts/smoke_stdio.py

      - name: Smoke-test MCP repair and artifact retrieval
        run: python scripts/smoke_mcp.py

      - name: Smoke-test Windows one-click demo
        if: runner.os == 'Windows'
        shell: powershell
        run: .\demo.ps1

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v5, pinned for a reproducible release pipeline.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # v6, pinned.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Build MCP service image
        run: docker build -t repo-rescue-mcp:test .

      - name: Build repository verifier image
        run: docker build -t repo-rescue-python:3.11 -f sandbox/Dockerfile.python311 .

      - name: Install repository orchestrator
        run: python -m pip install -e .

      - name: Run Docker baseline-repair-verify smoke
        run: python scripts/smoke_docker.py
